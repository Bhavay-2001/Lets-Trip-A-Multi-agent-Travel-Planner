
name: Deploy FastAPI to AWS EC2

on:
  push:
    branches:
      - main
    paths-ignore:
        - "README.md"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastapi-ec2-deployment
  cancel-in-progress: false

jobs:
  # Step 1: Build and push Docker image
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:main
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:sha-${{ github.sha }}

  # Step 2: Deploy on EC2 self-hosted runner
  continuous_deployment:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Deploy Docker container
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD : ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}

          # Application API keys
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          MODEL: ${{ secrets.MODEL }}
          POSTGRES_DATABASE_URL: ${{ secrets.POSTGRES_DATABASE_URL }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          # Authenticate to Docker Hub
          echo "docker log in" | docker login \
            --username "$DOCKER_USERNAME" \
            --password "DOCKER_PASSWORD"

          # Pull the exact image built by this workflow
          docker pull "$IMAGE_NAME:$IMAGE_TAG"

          # Create a protected environment file on EC2
          sudo install -d -m 700 /opt/travel-api

          ENV_FILE=$(mktemp)
          chmod 600 "$ENV_FILE"

          cleanup() {
            rm -f "$ENV_FILE"
          }
          trap cleanup EXIT

          printf '%s\n' \
            "OPENAI_API_KEY=$OPENAI_API_KEY" \
            "WEATHER_API_KEY=$WEATHER_API_KEY" \
            "FLIGHT_API_KEY=$FLIGHT_API_KEY" \
            "HOTEL_API_KEY=$HOTEL_API_KEY" \
            > "$ENV_FILE"

          sudo install -m 600 "$ENV_FILE" \
            /opt/travel-api/.env

          # Remove the previous container if present
          docker rm -f travel-api 2>/dev/null || true

          # Start the updated application
          docker run -d \
            --name travel-api \
            --restart unless-stopped \
            --env-file /opt/travel-api/.env \
            -p 8000:8000 \
            "$IMAGE_NAME:$IMAGE_TAG"

          # Verify that the container is running
          sleep 5
          docker inspect --format='{{.State.Status}}' travel-api

          docker logout
          echo "Deployment completed.
